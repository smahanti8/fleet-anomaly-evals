[project]
name = "fleet-anomaly-evals"
version = "0.1.0"
description = "Evaluation harness for fleet anomaly detection against labeled ground truth"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_evals"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
